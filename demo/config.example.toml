# findit demo configuration.
#   cp config.example.toml config.toml   and edit. config.toml is gitignored.
# The server reads it via FINDIT_CONFIG (default ./config.toml); without a file,
# built-in defaults run everything with mock models.
# Any value can be overridden by an env var FINDIT_<SECTION>_<KEY>, e.g.
#   FINDIT_VLM_URL=  FINDIT_DETECTOR_BACKEND=mock

[server]
host = "0.0.0.0"
port = 8000
public_hostname = "mapmaker-gpu2.csail.mit.edu"   # only used to print the URL
data_dir = "./data"          # SQLite + transient uploads (deleted after processing)
thumb_size = 96              # object-crop thumbnail px; 0 stores no pixels at all

[detector]
backend = "owlv2"            # mock | owlv2 | yoloe
owlv2_model = "google/owlv2-base-patch16-ensemble"
yoloe_weights = "yoloe-11s-seg.pt"
threshold = 0.25
vocab = [
  "sunglasses", "glasses", "keys", "headphones", "earbuds", "book", "scissors",
  "phone", "wallet", "remote control", "mug", "bottle", "laptop", "pen",
  "notebook", "hat", "bag",
]

[embedder]
backend = "siglip2"          # mock | siglip2
siglip2_model = "google/siglip2-base-patch16-224"

[vlm]
# backend: "transformers" runs the model in-process (simplest; works on V100),
#          "openai" talks to an OpenAI-compatible server (vLLM, llama.cpp) at `url`,
#          "mock" returns placeholder descriptions.
backend = "transformers"
model = "Qwen/Qwen3-VL-4B-Instruct"
dtype = "float16"            # V100/T4: float16. Ampere or newer: bfloat16.
# only for backend = "openai"; scripts/csail_run.sh launches vLLM with these:
url = "http://127.0.0.1:8001/v1"
port = 8001
gpu_memory_utilization = 0.6
max_model_len = 8192

[pipeline]
sample_fps = 1.0
scene_note_every_s = 5.0     # VLM writes a one-line note about the scene this often (0 = off). Used by "ask anything".
ask_max_images = 6           # object thumbnails shown to the VLM when answering a free-form question
track_sim = 0.80             # cosine on crop embeddings to link detections
track_iou = 0.10
query_min_sim = 0.05

[deploy]                      # used by the scripts only. "~" and "$USER" are expanded.
gpu = [3, 4, 5]               # nvidia-smi indices to use; one worker (own model copy, ~12 GB) per GPU. -1 = all
torch_index = ""              # "" = auto: CUDA 12.6 wheels (torch 2.14) on Volta or drivers < 580, else PyPI default
# Keep the venv and the model cache on local disk, not in an AFS home directory:
# torch + vLLM is ~10 GB of packages and AFS is slow and quota-limited.
venv = "/scratch/$USER/findit-venv"    # if there is no /scratch: df -h | grep ^/dev  and pick a local disk
hf_home = "/scratch/$USER/hf"
